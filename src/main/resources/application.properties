spring.application.name=finanzas-personales-back

server.servlet.context-path=/api

spring.jpa.open-in-view=false

spring.main.banner-mode=console
spring.main.allow-bean-definition-overriding=true

# La clave nunca se envia al navegador. Compatible con Chat Completions y tools.
app.asistente.enabled=${AI_ENABLED:true}
app.asistente.api-key=${AI_API_KEY:${DEEPSEEK_API_KEY:}}
app.asistente.base-url=${AI_BASE_URL:https://api.deepseek.com}
app.asistente.model=${AI_MODEL:deepseek-flash}

# Un solo bot por base de datos. Los secretos permanecen exclusivamente en el backend.
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
