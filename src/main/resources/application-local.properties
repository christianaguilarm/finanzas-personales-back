spring.config.import=optional:classpath:application-secret.properties

server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/finanzas_personales
spring.datasource.username=finanzas_user
spring.datasource.password=Finanzas2026!

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Auth0 (tenant de dev) ---
# OJO con el formato: el issuer-uri lleva https:// y barra final, el 'domain' del front no.
# Ninguno de los dos es un secreto: se pueden hardcodear por perfil.
# <DEV_DOMAIN> = Settings > General > Tenant Domain, sin https:// y sin barra final.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-phwap6gl.us.auth0.com/
# Audience de la API, no el del front: debe coincidir con el de la Application SPA de dev.
app.auth0.audiences=https://finanzas-personales-api

