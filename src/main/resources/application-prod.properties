server.port=${PORT}

spring.datasource.url=${DATABASE_URL}?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

# --- Auth0 (tenant de prod) ---
# OJO con el formato: el issuer-uri lleva https:// y barra final, el 'domain' del front no.
# Ninguno de los dos es un secreto: se pueden hardcodear por perfil.
# <PROD_DOMAIN> = Settings > General > Tenant Domain, sin https:// y sin barra final.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://finanzas-personales-prod.us.auth0.com/
# Audience de la API, no el del front: debe coincidir con el de la Application SPA de prod.
app.auth0.audiences=https://api.finanzas-personales
