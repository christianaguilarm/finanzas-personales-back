# Solo para tests: base temporal, sin configuración ni credenciales de producción.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finanzas_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finanzas_ci}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ci_only_password}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.example.test/
app.auth0.audiences=https://finanzas-ci.example.test
